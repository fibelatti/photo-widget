name: Android CI

on: [ push ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Project checkout
        uses: actions/checkout@v7

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Build
        run: ./gradlew assemble

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          archive: false

  instrumented_tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ build ]
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Project checkout
        uses: actions/checkout@v7

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-pixel_6

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests
        id: instrumented-tests
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          script: |
            adb logcat -c                             # clear logs
            touch app/emulator.log                    # create log file
            chmod 777 app/emulator.log                # allow writing to log file
            adb logcat >> app/emulator.log &          # pipe all logcat messages into log file as a background process
            ./gradlew connectedDebugAndroidTest

      - name: Upload failing instrumented tests logs
        if: steps.instrumented-tests.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-tests-logs
          path: |
            app/emulator.log
            app/build/reports/androidTests/connected/

      - name: Report failing instrumented tests
        if: steps.instrumented-tests.outcome != 'success'
        run: exit 1

  code_analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Project checkout
        uses: actions/checkout@v7

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Spotless check
        run: ./gradlew spotlessCheck

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Project checkout
        uses: actions/checkout@v7

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Run lint checks
        run: ./gradlew lint

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Project checkout
        uses: actions/checkout@v7

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Run license checks
        run: ./gradlew licensee

  permissions-check:
    name: Permissions Check
    runs-on: ubuntu-latest
    steps:
      - name: Project checkout
        uses: actions/checkout@v7

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Run permission checks
        run: ./gradlew checkReleaseManifestPermissions

  plugin-validation:
    name: Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - name: Project checkout
        uses: actions/checkout@v7

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Validate convention plugins
        run: ./gradlew :build-logic:convention:validatePlugins
